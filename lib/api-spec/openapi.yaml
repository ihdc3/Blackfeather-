openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Blog post operations
  - name: site
    description: Site-wide settings (title, banner)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: auth
    description: Authentication/identity operations.
paths:
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current auth identity
      description: |
        Returns whether the current request is signed in, and whether the
        signed-in user is the single admin/owner account. Used by the
        frontend to decide whether to show owner-only controls (write,
        edit, delete, settings) -- the real enforcement always happens
        server-side on the write endpoints themselves.
      responses:
        "200":
          description: Current auth identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [site]
      summary: Get site settings
      description: Returns the site's title and banner image.
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateSiteSettings
      tags: [site]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts
      description: Returns all posts, most recent first. Optionally filter by status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PostStatus"
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/summary:
    get:
      operationId: getPostsSummary
      tags: [posts]
      summary: Blog summary stats
      description: Aggregate counts used for a dashboard-style overview.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsSummary"
  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AuthIdentity:
      type: object
      required:
        - isSignedIn
        - isAdmin
      properties:
        isSignedIn:
          type: boolean
        isAdmin:
          type: boolean
          description: True only for the single owner account identified by ADMIN_EMAIL.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PostStatus:
      type: string
      description: Publication status of a post.
      enum: [draft, published, archived]
    EncryptionLevel:
      type: string
      description: Decorative security classification shown on the post (terminal theme flavor, not real encryption).
      enum: [plaintext, encrypted, classified]
    Post:
      type: object
      required:
        - id
        - title
        - slug
        - content
        - excerpt
        - authorName
        - status
        - encryptionLevel
        - coverImageUrl
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        authorName:
          type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        encryptionLevel:
          $ref: "#/components/schemas/EncryptionLevel"
        coverImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostInput:
      type: object
      required:
        - title
        - content
        - authorName
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        excerpt:
          type: string
        authorName:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PostStatus"
        encryptionLevel:
          $ref: "#/components/schemas/EncryptionLevel"
        coverImageUrl:
          type: ["string", "null"]
    PostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        excerpt:
          type: string
        authorName:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PostStatus"
        encryptionLevel:
          $ref: "#/components/schemas/EncryptionLevel"
        coverImageUrl:
          type: ["string", "null"]
    PostsSummary:
      type: object
      required:
        - totalPosts
        - publishedCount
        - draftCount
        - latestPost
      properties:
        totalPosts:
          type: integer
        publishedCount:
          type: integer
        draftCount:
          type: integer
        latestPost:
          oneOf:
            - $ref: "#/components/schemas/Post"
            - type: "null"
    SiteSettings:
      type: object
      required:
        - id
        - title
        - bannerImageUrl
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        bannerImageUrl:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
    SiteSettingsUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        bannerImageUrl:
          type: ["string", "null"]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

